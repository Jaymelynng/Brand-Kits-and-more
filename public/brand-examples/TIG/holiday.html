<!doctype html><html lang="en"><meta charset="utf-8"><title>Seasonal celebration — TIGAR design example</title><style>@font-face{font-family:Barlow;src:url('/fonts/barlowcondensed/BarlowCondensed-Bold.ttf')}@font-face{font-family:DM;src:url('/fonts/dmsans/DMSans-Regular.ttf')}@font-face{font-family:Fredoka;src:url('/fonts/fredoka/Fredoka-SemiBold.ttf')}*{box-sizing:border-box}body{margin:0;font-family:DM,Arial,sans-serif;color:#0a3651;background:#fff}article{width:720px;min-height:960px;position:relative;overflow:hidden}h1,h2,p{margin:0}.eyebrow{font-size:15px;letter-spacing:3px;text-transform:uppercase}.button{display:inline-block;padding:17px 29px;border-radius:30px;font-size:19px;font-weight:bold;background:#f57f20;color:#101820;border-bottom:5px solid #b85304;box-shadow:0 8px 18px #001c3028}.sample{padding:12px 28px;font-size:12px;background:#fff;color:#142d3c;text-align:center;letter-spacing:.4px}.brandline{display:flex;align-items:center;justify-content:space-between;font-size:15px;letter-spacing:1px}img{display:block;max-width:100%}</style><body><article style="background:#8f071b;color:#fff;padding:32px 36px 34px;border:8px solid #e1ba64"><div class="brandline"><span>TIGAR GYMNASTICS</span><span style="color:white">HOLIDAY</span></div><div style="width:292px;height:292px;margin:26px auto 15px;filter:drop-shadow(0 18px 18px #30000b99)"><img src="https://fwkiadhkxqnlnvmzpgnw.supabase.co/storage/v1/object/public/gym-logos/82b34218-da57-4d72-92f4-206b6d3289eb-TIG-christmas-script-circle.png" alt="TIGAR gold holiday circle"></div><div style="text-align:center"><p class="eyebrow" style="font-size:13px;margin-bottom:16px">A gift with room to grow</p><h1 style="font-family:Barlow;font-size:67px;line-height:.98">GIVE THE GIFT<br>THAT LASTS ALL YEAR.</h1><p style="font-size:22px;line-height:1.45;margin:23px auto;max-width:540px">Looking for a present every kid flips for?</p></div><div style="height:4px;background:#e1ba64;margin:26px 0"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;color:#3b1520;text-align:center"><div style="background:#fff7e9;border-radius:14px;padding:18px 8px;box-shadow:0 8px 16px #3b001533"><div style="font-family:Barlow;font-size:30px">1</div><p style="font-size:16px;margin-top:6px">Choose amount</p></div><div style="background:#fff7e9;border-radius:14px;padding:18px 8px;box-shadow:0 8px 16px #3b001533"><div style="font-family:Barlow;font-size:30px">2</div><p style="font-size:16px;margin-top:6px">Send it</p></div><div style="background:#fff7e9;border-radius:14px;padding:18px 8px;box-shadow:0 8px 16px #3b001533"><div style="font-family:Barlow;font-size:30px">3</div><p style="font-size:16px;margin-top:6px">They redeem</p></div></div><div style="text-align:center;margin:30px 0 4px"><div class="button" style="background:#fff7e9;color:#781024;border-bottom-color:#c8a04c;padding-inline:40px">Explore gift cards →</div></div></article><aside class="sample">DESIGN EXAMPLE · Adapted from a campaign sent 2025-11-11. Historical offers are not reproduced.</aside></body></html>
